# yaml-language-server: $schema=https://isx.run/schema/tool.json
name: graalvm
description: Oracle GraalVM 25.6 for JDK 25

packages:
  - gcc
  - glibc-devel
  - zlib-devel
  - libstdc++-static

downloads:
  - url: https://gds.oracle.com/download/graal/25i6/latest/graalvm-jdk-25i6-25_linux-x64_bin.tar.gz
    sha256: c258365739c022ee2189bc83dac72c3627f34cb0b02668e4bd3969380ed54b69
    extract: /opt
    arch: x86_64
    links:
      /opt/graalvm-25.6.5.1+4.1/bin/native-image: /usr/local/bin/native-image
  - url: https://gds.oracle.com/download/graal/25i6/latest/graalvm-jdk-25i6-25_linux-aarch64_bin.tar.gz
    sha256: aa02942ba8a8860e330737919d5b77c28489fc56661d500bdb1436ab96d11799
    extract: /opt
    arch: aarch64
    links:
      /opt/graalvm-25.6.5.1+4.1/bin/native-image: /usr/local/bin/native-image

env:
  - name: GRAALVM_HOME
    value: /opt/graalvm-25.6.5.1+4.1

verify: native-image --version
