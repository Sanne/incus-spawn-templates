name: graalvm
description: Oracle GraalVM 25.4 for JDK 25

packages:
  - gcc
  - glibc-devel
  - zlib-devel
  - libstdc++-static

downloads:
  - url: https://gds.oracle.com/download/graal/25i4/latest/graalvm-jdk-25i4-25_linux-x64_bin.tar.gz
    sha256: 4fcc632cfc68e98f49f9316f8a3588bafe4f5289f120104e2d290a75cf33e28e
    extract: /opt
    arch: x86_64
    links:
      /opt/graalvm-25.4.4.1.1+1.1/bin/native-image: /usr/local/bin/native-image
  - url: https://gds.oracle.com/download/graal/25i4/latest/graalvm-jdk-25i4-25_linux-aarch64_bin.tar.gz
    sha256: 780d5784d3db9bbcff77775c4d026e4a0e21a041ba9dba7c59135949ea5234a4
    extract: /opt
    arch: aarch64
    links:
      /opt/graalvm-25.4.4.1.1+1.1/bin/native-image: /usr/local/bin/native-image

env:
  - export GRAALVM_HOME=/opt/graalvm-25.4.4.1.1+1.1

verify: native-image --version
