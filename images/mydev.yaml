name: tpl-mydev
description: My own dev environment
parent: tpl-java
tools:
  - podman
  - gradle
  - idea-backend
packages:
  - tig
host-resources:
  - source: ~/.m2/repository
    mode: overlay
  - source: ~/.gitconfig
    path: ~/.gitconfig
    mode: copy
  - source: ~/.local/share/containers/storage
    path: /mnt/podman-host-storage
  - source: ~/sources/incus-spawn-templates/podman-storage.conf
    path: /etc/containers/storage.conf
    mode: copy
  - source: ~/.ssh/agent-authorized-keys
    path: .ssh/authorized-keys
    mode: readonly
